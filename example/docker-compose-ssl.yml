services:
  localmqtest:
    container_name: ibmmq_main
    image: icr.io/ibm-messaging/mq:9.4.5.1-r1
    platform: linux/amd64
    ports:
      - "1414:1414"
      - "9443:9443"
    environment:
      - LICENSE=accept
      - MQ_QMGR_NAME=QM1
      - MQ_ADMIN_PASSWORD=password
      - MQ_APP_PASSWORD=password
    volumes:
      - ../pki:/etc/mqm/pki
      - ./echo.mqsc:/etc/mqm/30-echo.mqsc:ro
    healthcheck:
      test: ["CMD-SHELL", "chkmqready && chkmqhealthy"]
