name: Build and Test

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref or commit to test
        required: true
        type: string
  pull_request:
    branches:
    - main
  push:
    branches:
    - main

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      matrix:
        environment: ['ubuntu-latest', 'windows-latest']
        mq-client-version: ['9.4.5.1']
    runs-on: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: Install MQ Client
        uses: SeyfSV/setup-mqclient@v0.3.1
        with:
          mq-client-version: ${{ matrix.mq-client-version }}
          download-path: ${{ github.workspace }}/distr
      
      - name: Setup Go environment
        uses: actions/setup-go@v5.0.1
        with:
          go-version-file: go.mod
          cache: false

      - name: Check third-party license inventory
        if: runner.os == 'Linux'
        run: python3 scripts/update-third-party-licenses.py --check
            
      - name: Check MQ version
        working-directory: ./
        run: dspmqver

      - name: Test connection lifecycle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mq_path="$HOME/IBM/MQ/data"
          export CGO_CFLAGS="-I$mq_path/inc"
          export CGO_LDFLAGS="-L$mq_path/lib64 -Wl,-rpath,$mq_path/lib64"
          CGO_ENABLED=1 go test -race ./...

      - name: Build
        working-directory: ./
        run: ./build.sh
        shell: bash
      
      - name: Test
        working-directory: ./
        run: ./local-test.sh
        shell: bash
        if: matrix.environment == 'ubuntu-latest'

      - name: Test (SSL)
        working-directory: ./
        run: ./local-test-ssl.sh
        shell: bash
        if: matrix.environment == 'ubuntu-latest'
