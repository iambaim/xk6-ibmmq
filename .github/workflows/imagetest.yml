name: Image tests

on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - uses: KengoTODA/actions-setup-docker-compose@main
      with:
        version: 2.31.0

    - name: Start test
      shell: bash
      run: |
        cd tests
        docker compose -f docker-compose-test.yml up -d --wait --wait-timeout 180 qm
        docker compose -f docker-compose-test.yml run --build --rm k6 run /tmp/localtest.js

    - name: Cleanup
      if: always()
      shell: bash
      run: |
        cd tests
        docker compose -f docker-compose-test.yml down
